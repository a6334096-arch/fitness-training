<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176e69"><title>我的運動訓練手冊</title><style>:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#193b45;background:#f5f8f7}*{box-sizing:border-box}body{margin:0;padding-bottom:90px}header{background:linear-gradient(120deg,#164a59,#168478);color:white;padding:26px 20px;border-radius:0 0 24px 24px}h1{font-size:25px;margin:0 0 7px}h2{font-size:19px;margin:0 0 12px}p{line-height:1.6}main{max-width:700px;margin:auto;padding:15px}.card{background:white;border-radius:18px;padding:18px;margin-bottom:15px;box-shadow:0 2px 14px #143f4810}.muted{color:#627981;font-size:14px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}button,.btn{border:0;border-radius:11px;padding:11px;background:#e4f1ee;color:#155a57;font-weight:700;font-size:15px;cursor:pointer}button.active,.primary{background:#147b72;color:white}input,textarea,select{width:100%;border:1px solid #c7d8d7;border-radius:10px;padding:11px;font-size:16px;background:white;color:#173d43}label{display:block;margin:11px 0 5px;font-weight:600}.exercise{border-top:1px solid #e5eeee;padding:12px 0}.exercise:first-of-type{border:0}.exercise a{color:#137c77;text-decoration:none;font-weight:600}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.row input[type=checkbox]{width:24px;height:24px;accent-color:#178176}.small{font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:white;border-top:1px solid #ddd;padding:10px 4px env(safe-area-inset-bottom);z-index:2}nav button{background:transparent;font-size:14px}.hidden{display:none}.stat{font-size:24px;font-weight:800;color:#137b72}a{overflow-wrap:anywhere}@media(max-width:370px){.days button{padding:9px 2px;font-size:13px}}</style></head><body><header><h1>💪 我的運動訓練手冊</h1><div>一週全身訓練 · 真人教學 · 運動紀錄</div></header><main><section id="plan"><div class="card"><h2>選擇訓練日</h2><div id="days" class="days"></div></div><div class="card"><h2 id="title"></h2><p class="muted" id="warm"></p><div id="moves"></div><h2>收操伸展</h2><p id="cool"></p><a id="coolLink" target="_blank" rel="noopener">▶ 查看伸展教學</a></div><div class="card"><h2>當日運動紀錄</h2><label>日期</label><input id="date" type="date"><div class="grid"><div><label>體重 kg</label><input id="weight" type="number" step=".1" placeholder="選填"></div><div><label>腰圍 cm</label><input id="waist" type="number" step=".1" placeholder="選填"></div><div><label>運動分鐘</label><input id="minutes" type="number" min="0" placeholder="例如 45"></div><div><label>疲勞程度</label><select id="effort"><option value="1">1 輕鬆</option><option value="2">2 稍累</option><option value="3" selected>3 中等</option><option value="4">4 吃力</option><option value="5">5 非常吃力</option></select></div></div><label>重量／阻力、組數與心得</label><textarea id="notes" rows="3" placeholder="例如：胸推20kg，3組各10下"></textarea><div class="row"><label><input type="checkbox" id="done" style="width:auto"> 今日訓練完成</label></div><button class="primary" style="width:100%" onclick="save()">儲存今日紀錄</button><p class="muted">資料只保存在此裝置的瀏覽器，請定期匯出備份。</p></div></section><section id="history" class="hidden"><div class="card"><h2>訓練紀錄</h2><div class="grid"><div><div class="stat" id="total">0</div><span class="muted">累積紀錄</span></div><div><div class="stat" id="time">0</div><span class="muted">累積分鐘</span></div></div><div id="records"></div></div><div class="card"><h2>備份與還原</h2><div class="actions"><button onclick="backup()">匯出 JSON 備份</button><button onclick="document.getElementById('import').click()">匯入備份</button></div><input type="file" id="import" accept=".json,application/json" style="display:none" onchange="restore(event)"><p class="muted">換手機或清除網站資料前，請先匯出備份。匯入會合併同日期與星期的紀錄。</p></div></section></main><nav><button onclick="tab('plan')">📋 訓練課表</button><button onclick="tab('history')">📊 歷史紀錄</button></nav><script>const D=[{n:'週一｜健身房 A',w:'快走3分鐘＋肩關節活動及徒手深蹲2分鐘',m:[['腿推機','3組×10下'],['胸推機','3組×10下'],['滑輪下拉','3組×12下'],['腹部訓練機','3組×12下']],c:'胸、肩、大腿前後側各30秒，嬰兒式40秒'},{n:'週二｜彈力帶全身',w:'原地踏步2分鐘＋肩髖活動3分鐘',m:[['綠色帶二頭肌彎舉','2組×15下'],['綠色帶俯身划船','2組×15下'],['伏地挺身','2組×8～12下'],['藍色帶側向走','2組×每側10步'],['藍色帶臀橋','2組×15下']],c:'胸、肩、臀、腿後側各30秒，嬰兒式40秒'},{n:'週三｜主動恢復',w:'輕鬆散步15～20分鐘',m:[['貓牛式','2組×8次'],['鳥狗式','2組×每側8下']],c:'腿前後側、小腿、髖屈肌各30秒'},{n:'週四｜健身房 B',w:'腳踏車3分鐘＋髖與肩活動2分鐘',m:[['腿後勾機','3組×10下'],['坐姿划船','3組×12下'],['肩推機','3組×10下'],['腿伸展機','2組×每側10下'],['腹部訓練機','2組×每側10下']],c:'腿前後側、臀、肩各30秒，嬰兒式40秒'},{n:'週五｜藍色彈力帶臀腿核心',w:'踏步2分鐘＋徒手深蹲及髖部活動3分鐘',m:[['布面帶深蹲','2組×12下'],['側躺蚌殼式','2組×每側12下'],['布面帶臀橋','2組×15下'],['平板支撐','2組×30秒']],c:'臀、髖屈肌、大腿前側、小腿各30秒'},{n:'週六｜戶外有氧',w:'輕鬆步行或慢踩5～10分鐘',m:[['爬山或騎單車','45～90分鐘']],c:'慢走3分鐘，再伸展小腿、腿前後側、臀部'},{n:'週日｜休息',w:'自由安排',m:[['輕鬆散步','選做10～20分鐘'],['輕度伸展','選做5分鐘']],c:'胸、肩、臀部輕度伸展'}];let day=0;const $=id=>document.getElementById(id),search=q=>'https://www.youtube.com/results?search_query='+encodeURIComponent(q+' 正確姿勢 教學');const directVideos={};const warmVideo='https://www.youtube.com/watch?v=X6OXfo-KG5A';function data(){try{return JSON.parse(localStorage.getItem('fitness_records_v1')||'[]')}catch{return []}}function write(a){localStorage.setItem('fitness_records_v1',JSON.stringify(a))}function render(){ $('days').innerHTML=D.map((d,i)=>'<button class="'+(day===i?'active':'')+'" onclick="choose('+i+')">'+['一','二','三','四','五','六','日'][i]+'</button>').join('');let d=D[day];$('title').textContent=d.n;$('warm').textContent='暖身：'+d.w;let warmLink=document.getElementById('warmVideo');if(!warmLink){warmLink=document.createElement('a');warmLink.id='warmVideo';warmLink.target='_blank';warmLink.rel='noopener';$('warm').after(warmLink)}warmLink.href=warmVideo;warmLink.textContent='▶ 女力健身｜上肢動態暖身（直接觀看）';warmLink.style.display=[0,1,3].includes(day)?'inline-block':'none';$('cool').textContent=d.c;$('coolLink').removeAttribute('href');$('coolLink').textContent='女力健身收操影片待確認';$('coolLink').style.color='#627981';$('moves').innerHTML=d.m.map((m,i)=>{let v=directVideos[m[0]];return '<div class="exercise"><div class="row"><strong>'+m[0]+'</strong><span class="muted">'+m[1]+'</span></div><div class="row"><label class="small"><input type="checkbox" class="movecheck" data-i="'+i+'" style="width:auto"> 已完成</label><a href="'+(v?v.url:search(m[0]))+'" target="_blank" rel="noopener">'+(v?'▶ 直接觀看':'▶ 搜尋示範')+'</a></div>'+(v?'<div class="muted small">來源：'+v.by+(v.note?'｜'+v.note:'')+'</div>':'<div class="muted small">尚未找到合適的指定教學影片。</div>')+'</div>'}).join('');loadDay()}function choose(i){day=i;render()}function key(){return $('date').value+'|'+day}function loadDay(){let r=data().find(x=>x.key===key());['weight','waist','minutes','notes'].forEach(k=>$(k).value=r?.[k]||'');$('effort').value=r?.effort||'3';$('done').checked=!!r?.done;document.querySelectorAll('.movecheck').forEach((x,i)=>x.checked=!!r?.checks?.[i])}function save(){if(!$('date').value){alert('請選擇日期');return}let a=data(),r={key:key(),date:$('date').value,day,weight:$('weight').value,waist:$('waist').value,minutes:$('minutes').value,effort:$('effort').value,notes:$('notes').value,done:$('done').checked,checks:[...document.querySelectorAll('.movecheck')].map(x=>x.checked)};a=a.filter(x=>x.key!==r.key);a.push(r);try{write(a);alert('已儲存到本機瀏覽器')}catch{alert('儲存失敗，請檢查瀏覽器儲存空間')}}function tab(t){$('plan').classList.toggle('hidden',t!=='plan');$('history').classList.toggle('hidden',t!=='history');if(t==='history')renderHistory();scrollTo(0,0)}function renderHistory(){let a=data().sort((x,y)=>y.date.localeCompare(x.date));$('total').textContent=a.length;$('time').textContent=a.reduce((s,x)=>s+(Number(x.minutes)||0),0);$('records').innerHTML='';a.forEach(r=>{let e=document.createElement('div');e.className='exercise';let title=document.createElement('strong');title.textContent=r.date+' '+D[r.day].n;e.append(title);let p=document.createElement('p');p.className='muted';p.textContent=(r.done?'✓ 完成':'未標記完成')+'｜'+(r.minutes||0)+'分鐘｜'+(r.weight||'—')+'kg｜'+(r.notes||'');e.append(p);let edit=document.createElement('button');edit.textContent='編輯';edit.onclick=()=>{day=r.day;$('date').value=r.date;tab('plan');render()};let del=document.createElement('button');del.textContent='刪除';del.onclick=()=>{if(confirm('確定刪除這筆紀錄？')){write(data().filter(x=>x.key!==r.key));renderHistory()}};e.append(edit,document.createTextNode(' '),del);$('records').append(e)})}function backup(){let b=new Blob([JSON.stringify(data(),null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='fitness-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function restore(e){let f=e.target.files[0];if(!f)return;try{let incoming=JSON.parse(await f.text());if(!Array.isArray(incoming)||!incoming.every(x=>x&&typeof x.key==='string'&&typeof x.date==='string'&&Number.isInteger(x.day)&&x.day>=0&&x.day<7))throw Error();let map=new Map(data().map(x=>[x.key,x]));incoming.forEach(x=>map.set(x.key,x));write([...map.values()]);renderHistory();alert('備份已匯入')}catch{alert('備份格式不正確')}e.target.value=''}$('date').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);$('date').onchange=loadDay;render();</script></body></html>
